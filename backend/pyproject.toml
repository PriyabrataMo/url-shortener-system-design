[project]
name = "url-shortener-api"
version = "0.1.0"
description = "A small Flask URL shortener for learning system design"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1,<4",
    "flask-cors>=6,<7",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "redis>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
